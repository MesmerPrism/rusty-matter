[workspace]
members = [
    "crates/rusty-matter-fixtures",
    "crates/rusty-matter-fields",
    "crates/rusty-matter-handmesh-wasm",
    "crates/rusty-matter-mesh",
    "crates/rusty-matter-model",
    "crates/rusty-matter-particles",
    "crates/rusty-matter-schema",
    "crates/rusty-matter-sdf",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Till Holzapfel"]
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
